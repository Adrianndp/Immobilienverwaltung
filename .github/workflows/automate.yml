name: CI and deploy

on:
  push:
    branches:
      - main
  pull_request:


jobs:
    backend:
        runs-on: ubuntu-latest
        services:
          db:
            image: postgres:18.6
            env:
              POSTGRES_DB: ci
              POSTGRES_USER: ci
              POSTGRES_PASSWORD: ci
            ports:
              - 5432:5432
            options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          DJANGO_SECRET_KEY: ci
        defaults:
          run:
            working-directory: backend
        steps:
        - uses: actions/checkout@v5
        - uses: actions/setup-python@v6
          with:
            python-version: '3.14'
            cache: pip
            cache-dependency-path: backend/requirements.txt
        - run: pip install -r requirements.txt
        # Fails if a model change has no migration file.
        - run: python manage.py makemigrations --check --dry-run
        - run: python manage.py test

    frontend:
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: frontend
        steps:
        - uses: actions/checkout@v5
        - uses: actions/setup-node@v5
          with:
            node-version: '22'
            cache: npm
            cache-dependency-path: frontend/package-lock.json
        - run: npm ci
        - run: npm run lint
        - run: npm run build

    # Builds the Docker images and pushes them to the GitHub Container Registry
    # (ghcr.io), tagged with the commit SHA. Only on pushes to main, after tests pass.
    images:
        needs: [backend, frontend]
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        # GITHUB_TOKEN may read the code and write packages (= images).
        permissions:
          contents: read
          packages: write
        # Runs this job twice in parallel: once per image.
        strategy:
          matrix:
            include:
              - name: backend
                context: backend
                dockerfile: backend/Dockerfile
              - name: frontend
                context: frontend
                dockerfile: frontend/Dockerfile.prod
        steps:
        - uses: actions/checkout@v5
        - uses: docker/setup-buildx-action@v4
        - uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - uses: docker/build-push-action@v7
          with:
            context: ${{ matrix.context }}
            file: ${{ matrix.dockerfile }}
            push: true
            # ghcr.io needs lowercase names.
            tags: |
              ghcr.io/adrianndp/immobilienverwaltung-${{ matrix.name }}:${{ github.sha }}
              ghcr.io/adrianndp/immobilienverwaltung-${{ matrix.name }}:latest

    cleanup:
      needs: images
      runs-on: ubuntu-latest
      permissions:
        packages: write
      strategy:
        matrix:
          name: [backend, frontend]
      steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: immobilienverwaltung-${{ matrix.name }}
          package-type: container
          min-versions-to-keep: 7

    # Disabled: the Hetzner server is shut down. The app now runs on a local
    # minikube cluster (see k8s/ and README), which GitHub Actions can't reach.
    # To re-enable, change `if` back to: github.event_name == 'push'
    deploy:
        needs: [backend, frontend]
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
        - name: Deploy via SSH
          uses: appleboy/ssh-action@v0.1.5
          with:
            host: ${{ secrets.HETZNER_HOST }}
            username: ${{ secrets.HETZNER_USERNAME }}
            key: ${{ secrets.HETZNER_SSH_KEY }}
            script: |
              set -e
              cd ~/Immobilienverwaltung
              git pull --ff-only origin main
              docker compose -f docker-compose.prod.yml up -d --build
